name: Cloudflare Worker build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

  build:
    name: Install and dry-run deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The lockfile makes Cloudflare's dependency graph reproducible. Lifecycle
      # scripts are disabled because this job only validates the Worker build.
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # This compiles the Worker and validates the root Deploy Button config
      # without creating or changing anything in the Cloudflare account.
      - run: npx wrangler deploy --dry-run --config wrangler.toml
